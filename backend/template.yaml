AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Polly Voice Node.js API

Parameters:
  MediaBucketName:
    Type: String
  HistoryTableName:
    Type: String
    Default: polly-voice-history
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  AllowedOrigins:
    Type: String
    Default: http://localhost:5173
  TranscribeLanguageCode:
    Type: String
    Default: en-US

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 60
    MemorySize: 1024
    Tracing: Active

Resources:
  HistoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref HistoryTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: entityId
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: EntityIndex
          KeySchema:
            - AttributeName: entityId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref MediaBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, HEAD]
            AllowedOrigins:
              - !Ref AllowedOrigins
            MaxAge: 3600

  PollyVoiceApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigins
        AllowHeaders:
          - Authorization
          - Content-Type
          - X-User-Id
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS

  PollyVoiceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/lambda.ts]
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
    Properties:
      Handler: src/lambda.handler
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref PollyVoiceApi
            Path: /
            Method: ANY
            PayloadFormatVersion: "2.0"
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref PollyVoiceApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: "2.0"
      Environment:
        Variables:
          NODE_ENV: production
          AWS_ENABLED: "true"
          AWS_REGION: !Ref AWS::Region
          AWS_DYNAMODB_TABLE_NAME: !Ref HistoryTable
          AWS_S3_MEDIA_BUCKET: !Ref MediaBucketName
          AWS_COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          AWS_COGNITO_CLIENT_ID: !Ref CognitoClientId
          AWS_COGNITO_ISSUER_URI: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}
          AWS_TRANSCRIBE_LANGUAGE_CODE: !Ref TranscribeLanguageCode
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          PUBLIC_BASE_URL: https://placeholder.invalid
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HistoryTable
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
        - Statement:
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
                - polly:DescribeVoices
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob
                - transcribe:DeleteTranscriptionJob
              Resource: "*"

Outputs:
  ApiUrl:
    Description: HTTP API URL
    Value: !Sub https://${PollyVoiceApi}.execute-api.${AWS::Region}.amazonaws.com
  FunctionName:
    Value: !Ref PollyVoiceFunction
  MediaBucket:
    Value: !Ref MediaBucket
  HistoryTable:
    Value: !Ref HistoryTable
